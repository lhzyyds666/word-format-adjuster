name: Build Windows package

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows desktop app
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Make distributables
        run: npm run make

      - name: Show packaged files
        shell: pwsh
        run: |
          Get-ChildItem -Path out/make -Recurse -File |
            Select-Object FullName, Length |
            Format-Table -AutoSize

      - name: Upload Windows package artifact
        uses: actions/upload-artifact@v4
        with:
          name: word-format-adjuster-win32-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            out/make/squirrel.windows/x64/WordFormatAdjusterSetup.exe
            out/make/squirrel.windows/x64/*.nupkg
            out/make/squirrel.windows/x64/RELEASES
            out/make/zip/win32/x64/*.zip

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @(
            (Get-Item "out/make/squirrel.windows/x64/WordFormatAdjusterSetup.exe").FullName
            (Get-Item "out/make/squirrel.windows/x64/*.nupkg").FullName
            (Get-Item "out/make/squirrel.windows/x64/RELEASES").FullName
            (Get-Item "out/make/zip/win32/x64/*.zip").FullName
          )

          if (gh release view $tag *> $null) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --title $tag --notes "Automated Windows desktop build."
          }
