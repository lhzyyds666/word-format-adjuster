name: Build desktop packages

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            platform: win32
            arch: x64
            artifact: word-format-adjuster-windows-x64
          - label: macOS x64
            os: macos-latest
            platform: darwin
            arch: x64
            artifact: word-format-adjuster-macos-x64
          - label: Linux x64
            os: ubuntu-latest
            platform: linux
            arch: x64
            artifact: word-format-adjuster-linux-x64

    env:
      BUILD_PLATFORM: "${{ matrix.platform }}"
      BUILD_ARCH: "${{ matrix.arch }}"
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: "${{ runner.temp }}/electron-cache"
          key: "${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}"
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Make distributables
        shell: pwsh
        env:
          ELECTRON_CACHE: "${{ runner.temp }}/electron-cache"
          DEBUG: "electron-forge:*,electron-packager,@electron/get:*"
        run: |
          Remove-Item -LiteralPath "out" -Recurse -Force -ErrorAction SilentlyContinue
          npm run make -- --platform=$env:BUILD_PLATFORM --arch=$env:BUILD_ARCH
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "electron-forge make failed; the next step will try the electron-packager fallback."
            exit 0
          }

      - name: Collect packaged files
        shell: pwsh
        env:
          ELECTRON_CACHE: "${{ runner.temp }}/electron-cache"
        run: |
          $artifactDir = "dist-artifacts"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

          $knownExtensions = @(".zip", ".dmg", ".pkg", ".deb", ".rpm", ".AppImage", ".exe", ".nupkg")
          $files = @()

          if (Test-Path "out/make") {
            $files = Get-ChildItem -Path "out/make" -Recurse -File |
              Where-Object {
                $knownExtensions -contains $_.Extension -or $_.Name -eq "RELEASES"
              }
          }

          if ($files.Count -eq 0) {
            Write-Host "Forge maker artifacts were not found. Running electron-packager fallback..."

            $fallbackOut = Join-Path $env:RUNNER_TEMP "word-format-adjuster-package"
            Remove-Item -LiteralPath $fallbackOut -Recurse -Force -ErrorAction SilentlyContinue

            $packagerArgs = @(
              "exec",
              "--",
              "electron-packager",
              ".",
              "WordFormatAdjuster",
              "--platform=$env:BUILD_PLATFORM",
              "--arch=$env:BUILD_ARCH",
              "--out=$fallbackOut",
              "--overwrite",
              "--asar",
              "--executable-name=WordFormatAdjuster"
            )

            & npm @packagerArgs
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }

            $packageDir = Get-ChildItem -Path $fallbackOut -Directory | Select-Object -First 1
            if (-not $packageDir) {
              throw "electron-packager did not create a package directory."
            }

            if ($env:BUILD_PLATFORM -eq "darwin") {
              $appBundle = Get-ChildItem -Path $packageDir.FullName -Directory -Filter "*.app" | Select-Object -First 1
              if (-not $appBundle) {
                throw "macOS fallback package did not contain an .app bundle."
              }

              $portableZip = Join-Path $artifactDir "WordFormatAdjuster-darwin-$env:BUILD_ARCH-portable.zip"
              & ditto -c -k --sequesterRsrc --keepParent $appBundle.FullName $portableZip
              if ($LASTEXITCODE -ne 0) {
                exit $LASTEXITCODE
              }

              $files = @(Get-Item -LiteralPath $portableZip)
            } elseif ($env:BUILD_PLATFORM -eq "linux") {
              $portableTar = Join-Path $artifactDir "WordFormatAdjuster-linux-$env:BUILD_ARCH-portable.tar.gz"
              & tar -czf $portableTar -C $packageDir.FullName .
              if ($LASTEXITCODE -ne 0) {
                exit $LASTEXITCODE
              }

              $files = @(Get-Item -LiteralPath $portableTar)
            } else {
              $portableZip = Join-Path $artifactDir "WordFormatAdjuster-win32-$env:BUILD_ARCH-portable.zip"
              Compress-Archive -Path (Join-Path $packageDir.FullName "*") -DestinationPath $portableZip -Force
              $files = @(Get-Item -LiteralPath $portableZip)
            }
          }

          if ($files.Count -eq 0) {
            Write-Host "No packaged files found. Generated files outside node_modules/.git:"
            Get-ChildItem -Path . -Recurse -File |
              Where-Object {
                $_.FullName -notmatch "[\\/](node_modules|\.git)[\\/]"
              } |
              Select-Object -First 200 -ExpandProperty FullName
            throw "No packaged files found after build."
          }

          $artifactRoot = (Resolve-Path $artifactDir).Path
          $files |
            Sort-Object -Property FullName -Unique |
            ForEach-Object {
              if ($_.DirectoryName -ne $artifactRoot) {
                Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $artifactDir $_.Name) -Force
              }
            }

          Get-ChildItem -Path $artifactDir -File |
            ForEach-Object { "{0} {1:n2} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.artifact }}"
          if-no-files-found: error
          retention-days: 14
          path: dist-artifacts/*

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = (Get-ChildItem "dist-artifacts" -File).FullName

          if (-not $assets) {
            throw "No assets found for release upload."
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --notes "Automated desktop builds."
            if ($LASTEXITCODE -ne 0) {
              gh release view $tag *> $null
              if ($LASTEXITCODE -ne 0) {
                exit $LASTEXITCODE
              }
            }
          }

          $assetArgs = @($assets)
          gh release upload $tag @assetArgs --clobber
