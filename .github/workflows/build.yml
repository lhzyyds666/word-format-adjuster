name: Build Windows package

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: Build Windows desktop app
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Make distributables
        run: npm run make -- --platform win32 --arch x64

      - name: Collect packaged files
        shell: pwsh
        run: |
          $artifactDir = "dist-artifacts"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

          $expected = @(
            "out/make/squirrel.windows/x64/WordFormatAdjusterSetup.exe"
            "out/make/squirrel.windows/x64/*.nupkg"
            "out/make/squirrel.windows/x64/RELEASES"
            "out/make/zip/win32/x64/*.zip"
          )

          $files = @()
          foreach ($pattern in $expected) {
            $files += Get-ChildItem -Path $pattern -File -ErrorAction SilentlyContinue
          }

          if ($files.Count -eq 0) {
            Write-Host "Installer artifacts were not found. Creating portable zip from packaged app..."
            $packageExe = Get-ChildItem -Path "out" -Recurse -File -Filter "WordFormatAdjuster.exe" -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($packageExe) {
              $packageDir = $packageExe.Directory.FullName
              $portableZip = Join-Path $artifactDir "WordFormatAdjuster-win32-x64-portable.zip"
              Compress-Archive -Path (Join-Path $packageDir "*") -DestinationPath $portableZip -Force
              $files = @(Get-Item -LiteralPath $portableZip)
            }
          }

          if ($files.Count -eq 0) {
            Write-Host "Portable package was not found. Searching workspace for known artifact files..."
            $files = Get-ChildItem -Path . -Recurse -File |
              Where-Object {
                $_.FullName -notmatch "\\node_modules\\" -and
                $_.FullName -notmatch "\\.git\\" -and
                (
                  $_.Name -eq "WordFormatAdjusterSetup.exe" -or
                  $_.Name -eq "WordFormatAdjuster.exe" -or
                  $_.Name -eq "RELEASES" -or
                  $_.Name -like "*.nupkg" -or
                  $_.Name -like "*.zip"
                )
              }
          }

          if ($files.Count -eq 0) {
            Write-Host "No packaged files found. First 200 generated files:"
            Get-ChildItem -Path . -Recurse -File |
              Where-Object {
                $_.FullName -notmatch "\\node_modules\\" -and
                $_.FullName -notmatch "\\.git\\"
              } |
              Select-Object -First 200 -ExpandProperty FullName
            throw "No packaged files found after npm run make."
          }

          foreach ($file in $files) {
            if ($file.DirectoryName -ne (Resolve-Path $artifactDir).Path) {
              Copy-Item -LiteralPath $file.FullName -Destination (Join-Path $artifactDir $file.Name) -Force
            }
          }

          Get-ChildItem -Path $artifactDir -File |
            ForEach-Object { "{0} {1:n2} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: Upload Windows package artifact
        uses: actions/upload-artifact@v4
        with:
          name: word-format-adjuster-win32-x64
          if-no-files-found: error
          retention-days: 14
          path: dist-artifacts/*

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = (Get-ChildItem "dist-artifacts" -File).FullName

          if (gh release view $tag *> $null) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --title $tag --notes "Automated Windows desktop build."
          }
